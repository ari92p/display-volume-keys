name: Release

on:
  push:
    tags: ["v*"]
  # A manual run only checks the Homebrew tap token.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tap-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check Homebrew tap access
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the cask must be updated manually."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ari92p/homebrew-tap.git" "$RUNNER_TEMP/tap"
          # A dry-run push still needs write access, so a read-only token fails here.
          git -C "$RUNNER_TEMP/tap" push --dry-run origin HEAD

  release:
    needs: tap-access
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$version" != "$plist_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $plist_version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_CERTIFICATE_P12" || -z "$SIGNING_CERTIFICATE_PASSWORD" ]]; then
            echo "Releases must be signed with the DisplayVolumeKeys certificate." >&2
            echo "Add SIGNING_CERTIFICATE_P12 and SIGNING_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          print -r -- "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            ${(f)"$(security list-keychains -d user | tr -d ' "')"}
        shell: zsh {0}

      - name: Build and verify
        env:
          DISPLAY_VOLUME_KEYS_SIGN_IDENTITY: DisplayVolumeKeys Signing
        run: ./build.sh

      - name: Check signature
        run: |
          signature="$(codesign -dvvv dist/DisplayVolumeKeys.app 2>&1)"
          if [[ "$signature" != *"Authority=DisplayVolumeKeys Signing"* ]]; then
            echo "The app is not signed with the release certificate." >&2
            exit 1
          fi

      - name: Package
        id: package
        run: |
          zip="DisplayVolumeKeys-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent dist/DisplayVolumeKeys.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "DisplayVolumeKeys ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set; update the cask manually:"
            echo "  version ${{ steps.version.outputs.version }}"
            echo "  sha256 ${{ steps.package.outputs.sha256 }}"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ari92p/homebrew-tap.git" "$RUNNER_TEMP/tap"
          scripts/update-cask.sh "$RUNNER_TEMP/tap/Casks/display-volume-keys.rb" \
            "${{ steps.version.outputs.version }}" "${{ steps.package.outputs.sha256 }}"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "The cask is already up to date."
            exit 0
          fi
          git commit -am "display-volume-keys ${{ steps.version.outputs.version }}"
          git push

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
