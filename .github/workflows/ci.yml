name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        # CI artifacts are ad-hoc signed test builds, not releases.
        env:
          DISPLAY_VOLUME_KEYS_SIGN_IDENTITY: "-"
        run: ./build.sh
      - name: Check scripts
        run: |
          zsh -n install.sh
          zsh -n scripts/create-signing-identity.sh
          zsh -n scripts/update-cask.sh
      - name: Package build artifact
        run: ditto -c -k --keepParent dist/DisplayVolumeKeys.app DisplayVolumeKeys.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayVolumeKeys-CI-test-build
          path: DisplayVolumeKeys.zip
          if-no-files-found: error
